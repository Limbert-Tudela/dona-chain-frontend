<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - DONA-CHAIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">DONA-CHAIN</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Inicio</a>
            <a class="nav-link" href="register.html">Registro</a>
        </div>
    </div>
</nav>

<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0"><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</h3>
        </div>
        <div class="card-body">
            <form id="loginForm" onsubmit="event.preventDefault(); alert('Demostración: El sistema completo con blockchain requiere backend Node.js.')">
                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="demo@donachain.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="********" required>
                </div>
                <button type="submit" class="btn btn-primary w-100"><i class="fas fa-key"></i> Ingresar</button>
            </form>
            <div class="text-center mt-3">
                <a href="register.html" class="btn btn-link">¿No tienes cuenta? Regístrate</a>
            </div>
            <div class="text-center mt-2">
                <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
            </div>
        </div>
    </div>
</div>

<footer class="text-center mt-5 py-3 bg-dark text-white">
    <p>DONA-CHAIN &copy; 2026 - Transparencia y trazabilidad con blockchain</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
